<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="jevGlow" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Hexagon/Rounded Shield -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#0F172A" />
  
  <!-- Outer Decision Frame -->
  <rect x="7" y="7" width="50" height="50" rx="13" stroke="url(#jevGlow)" stroke-width="2" stroke-dasharray="2 3" opacity="0.8"/>

  <!-- Decision Branching Geometry -->
  <!-- Left Path -->
  <path d="M32 20 L20 32 L32 44" stroke="url(#jevGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Branching Vector -->
  <path d="M32 20 L44 32 L32 44" stroke="url(#jevGlow)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central Pulse / System 1 Core -->
  <circle cx="32" cy="32" r="7" fill="url(#coreGlow)" filter="url(#shadow)" />
  <circle cx="32" cy="32" r="3" fill="#FFFFFF" />

  <!-- Decision Nodes -->
  <circle cx="20" cy="32" r="3.5" fill="#10B981" />
  <circle cx="44" cy="32" r="3.5" fill="#6366F1" />
  <circle cx="32" cy="18" r="3" fill="#06B6D4" />
  <circle cx="32" cy="46" r="3" fill="#3B82F6" />

  <!-- Speed Impulse Spark -->
  <path d="M48 14 L42 20 M48 20 L42 14" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
